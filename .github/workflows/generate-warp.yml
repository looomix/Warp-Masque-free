name: 生成 WARP MASQUE 配置

on:
  workflow_dispatch:
    inputs:
      device_name:
        description: 设备名（WARP 后台显示用）
        required: false
        default: gh-actions
      commit:
        description: 手动勾选：把含私钥的 YAML/JSON 提交到仓库（页面订阅才会更新）
        type: boolean
        required: false
        default: false
      probe:
        description: 生成前测速并按延迟排序（关闭则发布全部端点）
        type: boolean
        required: false
        default: true
      max_latency:
        description: 延迟阈值（毫秒），超过的端点不写入订阅
        required: false
        default: '1200'
      retention_days:
        description: artifact 保留天数
        required: false
        default: '7'

permissions:
  contents: write

concurrency:
  group: generate-warp
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 下载 usque（带重试）
        shell: bash
        run: |
          set -euo pipefail
          VER=$(curl -fsSL --retry 3 -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/Diniboy1123/usque/releases/latest | jq -r '.tag_name // empty' | sed 's/^v//')
          if [ -z "$VER" ]; then VER=4.2.1; fi
          echo "usque 版本 $VER"
          for i in 1 2 3; do
            if curl -fsSL --retry 3 -o usque.zip "https://github.com/Diniboy1123/usque/releases/download/v${VER}/usque_${VER}_linux_amd64.zip"; then break; fi
            sleep 5
          done
          test -s usque.zip
          unzip -oq usque.zip
          chmod +x usque

      - name: 注册 WARP 设备
        shell: bash
        env:
          DEVICE_NAME: ${{ inputs.device_name || 'gh-actions' }}
        run: |
          set -euo pipefail
          ./usque register -a -n "$DEVICE_NAME"
          test -s config.json
          python3 - <<'PY'
          import json
          c = json.load(open('config.json'))
          print('endpoint_v4 =', c.get('endpoint_v4'))
          print('ipv4 =', c.get('ipv4'))
          print('ipv6 =', c.get('ipv6'))
          PY

      - name: 测速 + 生成订阅
        shell: bash
        env:
          PROBE: ${{ inputs.probe }}
          MAX_LATENCY: ${{ inputs.max_latency || '1200' }}
        run: |
          set -euo pipefail
          ARGS=(--max-latency "${MAX_LATENCY}")
          if [ "${PROBE:-true}" = "false" ]; then ARGS+=(--no-probe); fi
          python3 scripts/generate.py config.json dist "${ARGS[@]}"
          mkdir -p configs
          cp dist/warp-masque.yaml configs/warp-masque.yaml
          cp config.json configs/usque-config.json
          cp config.json dist/usque-config.json
          for extra in warp-masque-links.txt health.json meta.json; do
            cp "dist/$extra" "configs/$extra"
          done
          test -s dist/warp-masque.yaml
          test -s dist/warp-masque-links.txt
          python3 - <<'PY'
          import json
          h = json.load(open('dist/health.json'))
          print(f"发布 {h.get('published')} 个节点（已验证 {h.get('verified')}，未验证 {h.get('unverified')}）")
          PY

      - name: 校验订阅配置
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 scripts/validate.py dist/warp-masque.yaml

      - name: 连通性自检（失败时输出排查提示）
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          h = json.load(open('dist/health.json'))
          print(f"探测结果: 已验证 {h.get('verified')}/{h.get('total')}，未验证 {h.get('unverified')}，剔除 {h.get('dropped')}")
          for p in h.get('ports', []):
              print(f"  端口 {p['port']}: 成功 {p['ok']} / 失败 {p['fail']}")
          for hint in h.get('hints', []):
              print("提示:", hint)
          if h.get('verified', 0) == 0:
              print("::warning::本次没有任何端点通过 QUIC 探测，订阅已按全量端点发布，请检查 Runner 出口是否允许 UDP")
          PY

      - name: 提交订阅配置（需勾选 commit）
        if: ${{ inputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          echo "警告：本次提交包含 WARP 私钥，请勿公开转发订阅"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs/warp-masque.yaml configs/usque-config.json \
                  configs/warp-masque-links.txt configs/health.json configs/meta.json
          if git diff --cached --quiet; then
            echo "配置无变化，无需提交"
          else
            git commit -m "chore: refresh WARP MASQUE subscription [skip ci]"
            git push
          fi

      - name: 上传 artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: warp-masque-config
          path: dist/
          retention-days: ${{ inputs.retention_days || 7 }}
          if-no-files-found: error
